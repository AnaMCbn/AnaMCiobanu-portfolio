# ---------- Site settings (edit these first) ----------
title: Your Name
email: you@example.com
description: "A short description of you and your work. It appears in Google results and link previews."
keywords: "portfolio, your field, your city"
skills: "Web Developer - Designer - Writer"
meta_author: Your Name

# Where the site lives. Leave both empty while working locally.
#  - custom domain or username.github.io:  url: "https://yourname.com"   baseurl: ""
#  - GitHub project page (user.github.io/repo):  url: "https://user.github.io"   baseurl: "/repo"
url: ""
baseurl: ""

# Search engine verification (optional)
google_verify:
bing_verify:

# ---------- Colors (hex codes without the #) ----------
color:
  primary: 18bc9c
  primary-rgb: "24,188,156"   # must match "primary" in RGB (18bc9c = 24,188,156)
  secondary: 2c3e50
  secondary-dark: 233140

# ---------- Footer ----------
# Icon-only links shown in the big footer. Entries with an empty url are hidden.
# "icon" is any Font Awesome class: "fa-brands fa-github", "fa-solid fa-envelope", ...
footer_links:
  - title: Email
    icon: fa-solid fa-envelope
    url: anamciobanu.dev@gmail.com
  - title: GitHub
    icon: fa-brands fa-github
    url: https://github.com/AnaMCbn
  - title: LinkedIn
    icon: fa-brands fa-linkedin
    url: https://www.linkedin.com

# Line at the very bottom of every page
theme_credit:
  name: Freelancer Jekyll theme
  url: https://github.com/jeromelachaud/freelancer-theme

# ---------- Build settings ----------
markdown: kramdown

# Articles are the regular posts in _posts/
permalink: /articles/:title/

# Projects live in _projects/ and get their own pages
collections:
  projects:
    output: true
    permalink: /projects/:name/

# Files Jekyll should not copy into the built site
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENCE
  - node_modules
  - vendor
