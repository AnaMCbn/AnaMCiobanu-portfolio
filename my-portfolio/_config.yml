# =====================================================================
# _config.yml  -  the main settings of the site
#
# IMPORTANT: Jekyll only reads this file when it starts. After you change it,
# stop `bundle exec jekyll serve` (Ctrl+C) and start it again, then hard refresh
# the browser (Ctrl+F5).
# =====================================================================


# ---------------------------------------------------------------------
# 1. ABOUT YOU
# ---------------------------------------------------------------------

# YOUR NAME. Three settings, so the name can be different in different places:
#   title       : the text in the browser tab (and the fallback for the two below)
#   nav_name    : the small name in the TOP BAR
#   header_name : the big name in the HOME HEADER
# If nav_name or header_name is empty, "title" is used there.
title: Ana-Maria Ciobanu
nav_name: Ana-Maria Ciobanu
header_name: Hi, I'm Ana!

# Your email address. Shown on the Contact page (the big email button).
# (The email icon in the top bar uses the Gmail link in footer_links below.)
email: anamciobanu.dev@gmail.com

# The text under your name in the home header. It can contain HTML (for example the link to your university).
# The link color is set in main.css (section 5), not here: color codes with curly braces do not work inside this file.
skills: 'I am a game programmer currently studying at <a href="https://www.buas.nl/en" target="_blank" rel="noopener">Breda University of Applied Sciences</a>.
 I enjoy developing gameplay systems and tools, with a focus on procedural generation and AI.'

# For search engines and link previews (not visible on the page).
description: "Hi, I'm Ana! I am a game programming currently studying at Breda University of Applied Sciences."
keywords: "portfolio, game programmer"
meta_author: Ana-Maria Ciobanu


# ---------------------------------------------------------------------
# 2. WHERE THE SITE LIVES  (affects every link, image and the stylesheet address)
# Leave both empty while working on your own computer.
#   Custom domain, or username.github.io:   url: "https://yourname.com"      baseurl: ""
#   GitHub project page (user.github.io/repo):  url: "https://user.github.io"  baseurl: "/repo"
# ---------------------------------------------------------------------
url: "https://anamcbn.github.io"
baseurl: ""

# Optional: codes that prove you own the site to Google / Bing. Leave empty if unused.
google_verify:
bing_verify:


# ---------------------------------------------------------------------
# 3. COLORS  (hex codes WITHOUT the #)
# These are used in _includes/css/main.css, so changing one changes the whole site.
# ---------------------------------------------------------------------
color:
  primary: 8A6A6A
  primary-dark: 614848 
  secondary: 515C47
  secondary-rgb: "108,123,95"
  secondary-dark: 49523D
  accent: F0EC93
  background: F5F5F5
  card: E5E2E2


# ---------------------------------------------------------------------
# 4. LINK BUTTONS  (email, GitHub, itch.io, LinkedIn)
# This ONE list is used in two places: the round buttons in the top bar, and the
# buttons on the Contact page. To add a link, copy an entry. To hide one, empty its url.
#   title : text on the Contact page button
#   icon  : any Font Awesome icon class, e.g. "fa-brands fa-github"
#   url   : where it goes. The email entry opens a new Gmail message; a "mailto:" link also works but needs a mail program on the visitor's computer.
# ---------------------------------------------------------------------
footer_links:
  - title: Email
    icon: fa-solid fa-envelope
    url: https://mail.google.com/mail/?view=cm&fs=1&to=anamciobanu.dev@gmail.com
  - title: GitHub
    icon: fa-brands fa-github
    url: https://github.com/AnaMCbn
  - title: itch.io
    icon: fa-brands fa-itch-io
    url: https://orbete.itch.io
  - title: LinkedIn
    icon: fa-brands fa-linkedin
    url: https://linkedin.com/in/ana-maria-ciobanu-529763353


# ---------------------------------------------------------------------
# 5. FOOTER CREDIT  (the line at the bottom of every page)
# ---------------------------------------------------------------------
theme_credit:
  name: Freelancer Jekyll theme
  url: https://github.com/jeromelachaud/freelancer-theme


# ---------------------------------------------------------------------
# 6. HOW THE SITE IS BUILT  (you rarely need to touch this)
# ---------------------------------------------------------------------
markdown: kramdown

# Articles are the files in _posts/. This makes their addresses look like /articles/my-title/
permalink: /articles/:title/

# Projects are the files in _projects/. Each one becomes its own page: /projects/name/
collections:
  projects:
    output: true
    permalink: /projects/:name/

# Files that are NOT copied into the finished website
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
