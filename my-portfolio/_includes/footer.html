<!-- Footer: links only, with the theme credit at the very bottom -->
<footer class="text-center">
  <div class="footer-above">
    <div class="container">
      {% if site.footer_links %}
      <ul class="list-inline footer-links">
        {% for link in site.footer_links %}
        {% if link.url and link.url != "" %}
        <li>
          <a href="{{ link.url }}" class="btn-social btn-outline" aria-label="{{ link.title }}" title="{{ link.title }}"><i
              class="{{ link.icon }} fa-fw"></i></a>
        </li>
        {% endif %}
        {% endfor %}
      </ul>
      {% endif %}
      <p class="footer-credit">
        This website was built using the
        <a href="{{ site.theme_credit.url }}">{{ site.theme_credit.name }}</a>
        &middot;
        <a href="{{ site.theme_credit.url }}">{{ site.theme_credit.url | remove: 'https://' }}</a>
      </p>
    </div>
  </div>
</footer>

<!-- Scroll to Top Button (only visible on small and extra-small screens) -->
<div class="scroll-top visible-xs visible-sm">
  <a class="btn btn-primary" href="#page-top" aria-label="Back to top">
    <i class="fa fa-chevron-up"></i>
  </a>
</div>
