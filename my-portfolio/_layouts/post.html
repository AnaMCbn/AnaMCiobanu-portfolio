---
layout: default
---
<header class="page-header">
  <div class="container">
    <div class="row">
      <div class="col-lg-12">
        <div class="intro-text">
          <h1 class="name">{{ page.title }}</h1>
          <hr class="star-light" />
          <span class="skills">{{ page.date | date: "%B %-d, %Y" }}</span>
        </div>
      </div>
    </div>
  </div>
</header>

<section class="content-page">
  <div class="container">
    <div class="row">
      <div class="col-lg-8 col-lg-offset-2">
        {{ content }}
        <hr>
        <a href="{{ '/articles/' | relative_url }}" class="btn btn-default"><i class="fa fa-arrow-left"></i> All articles</a>
      </div>
    </div>
  </div>
</section>
